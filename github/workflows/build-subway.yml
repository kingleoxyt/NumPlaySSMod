name: Build Subway

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build
        working-directory: games/subway
        run: make

      - name: Check the RAM limit
        working-directory: games/subway
        run: make check

      - uses: actions/upload-artifact@v4
        with:
          name: subway-nwa
          path: games/subway/output/subway.nwa
